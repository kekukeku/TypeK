name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 三個平台會合併同一個 latest.json；序列化避免平行讀寫互踩。
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            stable_name: TypeK-mac-arm64.dmg
            dmg_glob: "*.dmg"
            upload_sourcemaps: "true"
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            stable_name: TypeK-mac-x64.dmg
            dmg_glob: "*.dmg"
            upload_sourcemaps: "false"
          - platform: windows-latest
            args: ""
            rust_target: ""
            stable_name: TypeK-windows-x64.exe
            dmg_glob: ""
            upload_sourcemaps: "false"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 時必須建置輸入的 tag，而不是目前分支。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          RAW_TAG="${RAW_TAG#refs/tags/}"
          RELEASE_VERSION="${RAW_TAG#v}"

          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=typek@$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=typek@$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(jq -r .version package.json)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ] \
            || [ "$TAURI_VERSION" != "$RELEASE_VERSION" ] \
            || [ "$CARGO_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Version mismatch: tag=$RELEASE_VERSION package.json=$PACKAGE_VERSION tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          echo "Versions match $RELEASE_VERSION"

      - name: Refuse published tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null); then
            if [ "$(printf '%s' "$RELEASE_JSON" | jq -r .isDraft)" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; release a new version instead."
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists as a draft; continuing."
          else
            echo "Release $RELEASE_TAG does not exist yet."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # updater 的兩個 secret 是發版必要（下一步會檢查）；Apple 簽章維持不做，
      # 對應 secret 空白時完全不傳（不傳空字串），避免打包工具拿空值去匯入憑證或送公證。
      # TypeK 維持 ad-hoc（signingIdentity "-"）。見 docs/deployment-guide.md §5.4
      - name: Export optional signing secrets
        shell: bash
        env:
          OPT_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          OPT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          OPT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          OPT_APPLE_ID: ${{ secrets.APPLE_ID }}
          OPT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          OPT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            opt="OPT_${name}"
            value="${!opt}"
            if [ -n "$value" ]; then
              delim="EOF_${RANDOM}${RANDOM}${RANDOM}"
              { echo "${name}<<${delim}"; echo "$value"; echo "${delim}"; } >> "$GITHUB_ENV"
              echo "${name}: set"
            else
              echo "${name}: not set (skipped)"
            fi
          done

      - name: Require updater key
        shell: bash
        run: |
          set -euo pipefail
          PUBKEY=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "$PUBKEY" ]; then
            echo "::error::Updater signing key is missing. Set TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD and plugins.updater.pubkey; see docs/deployment-guide.md §5.4."
            exit 1
          fi
          echo "Updater signing key is configured"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          VITE_SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ env.SENTRY_RELEASE }}
          VITE_SENTRY_RELEASE: ${{ env.VITE_SENTRY_RELEASE }}
          VITE_SENTRY_SOURCEMAPS_ENABLED: ${{ matrix.upload_sourcemaps }}
          VITE_AUTO_UPDATE_ENABLED: "true"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "TypeK v${{ env.RELEASE_VERSION }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Upload frontend sourcemaps to Sentry
        if: matrix.upload_sourcemaps == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "Sentry sourcemap upload skipped: missing Sentry release secrets."
            exit 0
          fi

          npx @sentry/cli releases new "$SENTRY_RELEASE" || true
          npx @sentry/cli sourcemaps upload dist/assets \
            --release "$SENTRY_RELEASE" \
            --url-prefix "~/assets" \
            --validate \
            --wait
          npx @sentry/cli releases finalize "$SENTRY_RELEASE" || true

      - name: Upload stable-name asset (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | head -1)
          cp "$DMG" "${{ matrix.stable_name }}"
          gh release upload "$RELEASE_TAG" "${{ matrix.stable_name }}" --clobber

      - name: Upload stable-name asset (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "${{ matrix.stable_name }}"
          gh release upload "$env:RELEASE_TAG" "${{ matrix.stable_name }}" --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          RAW_TAG="${RAW_TAG#refs/tags/}"
          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RAW_TAG#v}" >> "$GITHUB_ENV"

      - name: Verify latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -p latest.json --clobber --repo "$GITHUB_REPOSITORY"
          jq -e . latest.json >/dev/null

          MANIFEST_VERSION=$(jq -r '.version // ""' latest.json)
          if [ "$MANIFEST_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::latest.json version '$MANIFEST_VERSION' does not match release '$RELEASE_VERSION'."
            exit 1
          fi

          for PLATFORM in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            URL=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].url // ""' latest.json)
            SIGNATURE=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].signature // ""' latest.json)
            if [ -z "$URL" ] || [ -z "$SIGNATURE" ]; then
              echo "::error::latest.json platform $PLATFORM is missing url or signature."
              exit 1
            fi
            case "$URL" in
              *"/download/$RELEASE_TAG/"*) ;;
              *)
                echo "::error::latest.json platform $PLATFORM does not point at $RELEASE_TAG: $URL"
                exit 1
                ;;
            esac
          done

          WINDOWS_URL=$(jq -r '.platforms["windows-x86_64"].url // ""' latest.json)
          case "$WINDOWS_URL" in
            *-setup.exe) ;;
            *)
              echo "::error::windows-x86_64 url is not an NSIS -setup.exe: $WINDOWS_URL"
              exit 1
              ;;
          esac
          echo "latest.json verified for $RELEASE_VERSION"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Check public latest
        shell: bash
        run: |
          set -euo pipefail
          LATEST_URL="https://github.com/kekukeku/TypeK/releases/latest/download/latest.json"
          if ! PUBLIC_LATEST=$(curl -fsSL "$LATEST_URL"); then
            echo "::warning::Could not fetch public latest.json after publishing."
            exit 0
          fi
          if ! PUBLIC_VERSION=$(printf '%s' "$PUBLIC_LATEST" | jq -r '.version // ""' 2>/dev/null); then
            echo "::warning::Public latest.json is not valid JSON after publishing."
            exit 0
          fi
          if [ "$PUBLIC_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::warning::Public latest.json reports '$PUBLIC_VERSION', expected '$RELEASE_VERSION'."
          else
            echo "Public latest.json reports $PUBLIC_VERSION"
          fi
